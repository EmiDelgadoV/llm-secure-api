<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LLM Secure API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #1B3A4B;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 24px;
            background: #1B3A4B;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #2a5570;
        }

        #respuesta {
            margin-top: 24px;
            background: white;
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid #1B3A4B;
            min-height: 60px;
            white-space: pre-wrap;
        }

        #error {
            color: #c0392b;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>LLM Secure API</h1>
    <p>Hacé tu consulta. El input es sanitizado antes de llegar al modelo.</p>
    <textarea id="input" placeholder="Escribí tu consulta acá..."></textarea>
    <br>
    <button onclick="consultar()">Consultar</button>
    <div id="error"></div>
    <div id="respuesta"></div>

    <script>
        async function consultar() {
            const texto = document.getElementById("input").value.trim();
            const respuestaDiv = document.getElementById("respuesta");
            const errorDiv = document.getElementById("error");

            respuestaDiv.textContent = "Consultando...";
            errorDiv.textContent = "";

            try {
                const res = await fetch("/consultar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ texto })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorDiv.textContent = data.detail || "Error desconocido";
                    respuestaDiv.textContent = "";
                } else {
                    respuestaDiv.textContent = data.respuesta;
                }
            } catch (err) {
                errorDiv.textContent = "Error de conexión";
                respuestaDiv.textContent = "";
            }
        }
    </script>
</body>

</html>
